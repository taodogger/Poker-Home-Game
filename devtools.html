<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapoker - Developer Tools</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/themes.css">
    <style>
        body {
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: auto;
        }
        #debug-log {
            margin-top: 15px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="dark-theme">

    <div class="container">
        <header class="app-header">
            <div class="header-content">
                <div class="header-left">
                    <div class="logo-wrapper">
                        <div id="text-logo" class="header-logo-text">
                            <span>K</span><span>a</span><span>p</span><span>o</span><span>k</span><span>e</span><span>r</span>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <section id="dev-tools">
                <div class="card-header">
                    <h2>Developer Tools</h2>
                </div>
                <div class="card-content">
                    <div class="dev-tool-buttons" style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <button id="test-connection-btn" class="poker-button">
                            Test Firebase Connection
                        </button>
                        <button id="force-mobile-layout-btn" class="poker-button">
                            Force Mobile Layout
                        </button>
                    </div>
                    <div id="debug-log">Debug log will appear here...</div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/devtools.js"></script>
</body>
</html>
